# Docker DNS resolver + variables so nginx boots even when `web` (profile) is not running.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    client_max_body_size 20m;

    location /api/ {
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # /ask is Server-Sent Events
        proxy_read_timeout 300s;
    }

    location / {
        set $web http://web:80;
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = @noweb;
    }

    location @noweb {
        default_type text/plain;
        return 503 "web UI not running (start with: docker compose --profile web up -d)\n";
    }
}
