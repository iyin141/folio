[project]
name = "folio"
version = "0.1.0"
description = "Library-scale book question answering with measured retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.11.4",
    "uvicorn[standard]==0.34.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["folio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py312"
