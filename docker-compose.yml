# Folio stack. `cp .env.example .env`, then `docker compose up -d --build`.
# Profiles: local-llm (ollama), web (UI placeholder, U1 fills it), restore (qdrant snapshot upload).
name: ${COMPOSE_PROJECT_NAME:-folio}

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}

services:
  api:
    build: { context: ., target: api, args: { EXTRA_PIP: "${EXTRA_PIP:-}" } }
    image: folio-api:local
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build: { context: ., target: worker, args: { EXTRA_PIP: "${EXTRA_PIP:-}" } }
    image: folio-worker:local
    environment:
      <<: *app-env
      CLAUDE_CONFIG_DIR: /home/folio/.claude
    volumes:
      # Host Claude CLI session (subscription login). Read-write: the CLI updates files under it.
      # Single-user deployment only; the mount gives the container the same credentials as the host user.
      - ${CLAUDE_HOST_DIR:-${HOME:-.}/.claude}:/home/folio/.claude
      - worker_data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A folio.worker inspect ping -d celery@$$HOSTNAME -t 5 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      # the image has no curl/wget; bash /dev/tcp is enough to prove the port is open
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Snapshot restore: put <collection>.snapshot files (chunks.snapshot, books.snapshot) in ./snapshots, then
  #   docker compose --profile restore run --rm qdrant-restore        (or: make snapshot-restore)
  # Safe to repeat: uploading replaces the collection from the snapshot.
  qdrant-restore:
    image: curlimages/curl:8.11.1
    profiles: ["restore"]
    depends_on:
      qdrant: { condition: service_healthy }
    volumes:
      - ./snapshots:/snapshots:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        n=0
        for f in /snapshots/*.snapshot; do
          [ -e "$$f" ] || { echo "no *.snapshot files in ./snapshots"; exit 1; }
          c=$$(basename "$$f" .snapshot)
          echo "restoring collection $$c"
          curl -fsS --retry 5 -X POST "http://qdrant:6333/collections/$$c/snapshots/upload?priority=snapshot" -F "snapshot=@$$f"
          echo
          n=$$((n+1))
        done
        echo "restored $$n collection(s)"

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-folio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: folio
    volumes:
      - pg_data:/var/lib/postgresql/data
      # creates the langfuse DB; runs only on an empty volume
      - ./docker/postgres/init-langfuse-db.sh:/docker-entrypoint-initdb.d/10-langfuse.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d folio"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Nightly pg_dump (03:00 UTC) of both databases into the pg_backups volume, 7 days kept.
  # Restore: see docs/VM_RUNBOOK.md.
  pgbackup:
    image: pgvector/pgvector:0.8.0-pg17
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-folio}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep $$(( (86400 + 10800 - $$(date +%s) % 86400) % 86400 + 1 ))
          for db in folio langfuse; do
            out=/backups/$$db-$$(date +%F).dump
            pg_dump -Fc "$$db" > "$$out.tmp" && mv "$$out.tmp" "$$out"
          done
          find /backups -name '*.dump' -mtime +7 -exec rm -f {} +
        done
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d folio"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Langfuse v2 needs only Postgres (v3 needs ClickHouse); it uses the `langfuse` DB in the postgres service.
  langfuse:
    image: langfuse/langfuse:2.95.11
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-folio}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3100}
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["local-llm"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Placeholder; U1 replaces it with the Next.js UI (same service name, listens on 80).
  web:
    image: nginx:1.27-alpine
    profiles: ["web"]
    volumes:
      - ./docker/web/index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api: { condition: service_healthy }
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_storage:
  pg_data:
  pg_backups:
  redis_data:
  ollama_data:
  worker_data:
